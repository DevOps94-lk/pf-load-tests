# Settings for pingfederate_authcode_loadtest.jmx (no secrets here).
# Run: jmeter -n -t pingfederate_authcode_loadtest.jmx -q env.properties -q secrets.properties -l results/run.jtl
# Override any value with -Jname=value (e.g. -Jthreads=1 -Jloops=1 for a smoke test). Read at start-up only.
# Format: key=value, no quotes, no trailing spaces. rampup/duration are seconds; everything else timed is ms.

# --- Target (applies to all 4 requests) ---
scheme=https
host=fedtesting-stg.transunion.com
port=443
# Max wait to open the connection / to receive a response. Exceeding either marks the request as an error.
connect_timeout_ms=10000
response_timeout_ms=30000

# --- OAuth client ---
# Step 1 query param and Basic-auth username in step 3 (secret is in secrets.properties).
client_id=GKE_AuthCode_client
# Requested in step 1. Needs "openid" for the userinfo call.
scope=openid

# --- Users ---
# CSV with header "username,password". One row per iteration, shared across threads; recycles at the end.
# Relative paths are resolved from the .jmx folder. More threads than rows (50) means users log in concurrently.
users_file=users.csv

# --- Load profile (each thread = one user repeating the whole journey) ---
# Concurrent users.
threads=10
# Seconds to start all threads, evenly. 0 = all at once.
rampup=60
# Total run time in seconds, including ramp-up. Time at full load = duration - rampup.
duration=300
# Journeys per thread. -1 = until duration ends. threads=1 + loops=1 = smoke test.
loops=-1

# --- Think time (pause before the credentials call; not counted in response times) ---
# Pause = think_ms + random(0..think_range_ms). Both 0 = no pause (max load, less realistic).
think_ms=1000
think_range_ms=500

# --- Credentials call ---
# Content-Type of step 2. Postman sent text/plain; switch only if step 2 returns 400/415.
authn_content_type=application/json
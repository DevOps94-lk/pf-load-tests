# Environment and load profile (no secrets here). Load with: jmeter -q env.properties -q secrets.properties ...
# Any value can be overridden on the command line with -Jname=value.

# --- Target (PingFederate runtime engine) ---
scheme=https
host=pingfederate.example.com
port=9031

# --- OAuth client (must have Authorization Code grant, PKCE, Refresh Token grant, client_secret_basic) ---
client_id=pkce_loadtest_client
redirect_uri=https://app.example.com/callback
scope=openid profile
# Optional: only if registered on the client for RP-initiated logout
#post_logout_redirect_uri=https://app.example.com/logged-out
# Optional: separate client for /as/introspect.oauth2 (defaults to client_id / client_secret)
#introspect_client_id=
#introspect_client_secret=

# --- Users ---
users_file=users.csv

# --- Load profile ---
threads=10
rampup=60
# Seconds the test runs; loops=-1 repeats the scenario until duration elapses
duration=300
loops=-1
# Think time per marked step = think_ms + random(0..think_range_ms)
think_ms=1000
think_range_ms=500
connect_timeout_ms=10000
response_timeout_ms=30000

# --- Behaviour toggles ---
# Read endpoint paths from /.well-known/openid-configuration (documented defaults are used if a field is missing)
discover=true
# Skip direct access-token revocation (JWT access tokens are only revoked indirectly via the refresh token)
revoke_access_token=true
# Introspect the access token after revocation and expect active=false
verify_revocation=true
# After logout, a new authorization request must require login again
verify_logout=true
# Client-side RSA signature check of JWT access tokens (costs load-generator CPU)
jwt_verify_signature=true
# Optional exact iss value to require in JWT access tokens
#expected_issuer=

# --- Per-endpoint path overrides (normally discovered) ---
#ep.authorize=/as/authorization.oauth2
#ep.token=/as/token.oauth2
#ep.introspect=/as/introspect.oauth2
#ep.userinfo=/idp/userinfo.openid
#ep.revoke=/as/revoke_token.oauth2
#ep.jwks=/pf/JWKS
#ep.end_session=/idp/init_logout.openid
